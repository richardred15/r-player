<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1024" y2="1024" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#7d99ff"/>
      <stop offset="1" stop-color="#4d6ae0"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="14" stdDeviation="18" flood-color="#1c2547" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- accent rounded-square background -->
  <rect x="0" y="0" width="1024" height="1024" rx="232" ry="232" fill="url(#bg)"/>

  <!-- eighth note, white -->
  <g fill="#ffffff" filter="url(#shadow)">
    <!-- stem -->
    <rect x="600" y="270" width="46" height="408" rx="23"/>
    <!-- flag -->
    <path d="M623 270
             C 752 296, 812 392, 742 520
             C 792 404, 748 330, 623 350 Z"/>
    <!-- note head -->
    <ellipse cx="468" cy="690" rx="138" ry="104" transform="rotate(-24 468 690)"/>
  </g>
</svg>
