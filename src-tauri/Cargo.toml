[package]
name = "r-player"
version = "0.1.0"
description = "R-Player music player"
authors = ["Richard"]
license = "MIT"
edition = "2021"

[lib]
name = "r_player_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["protocol-asset"] }
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
tauri-plugin-global-shortcut = "2"
tauri-plugin-sql = { version = "2", features = ["sqlite"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
walkdir = "2"
rayon = "1"
lofty = "0.24"
souvlaki = "0.8"
sha2 = "0.10"
tiny_http = "0.12"
percent-encoding = "2"
dirs = "6"

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"
strip = true
